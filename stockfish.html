<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU" crossorigin="anonymous">
<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js" integrity="sha384-8Vi8VHwn3vjQ9eUHUxex3JSN/NFqUg3QbPyX8kWyb93+8AC/pPWTzj+nHtbC5bxD" crossorigin="anonymous"></script>
<div id="board"></div>
<h1 id="eval"></h1>
<style>
    * {
        margin: 0px;
    }
    #board {
        margin: auto;
    }
    #eval {
        text-align: center;
        font-size: 8vh;
    }
    @media (orientation: portrait) {
        #board {
            width: 100vw;
        }
    }
    @media (orientation: landscape) {
        #board {
            width: 90vh;
        }
    }
</style>
<script>
    let config = {
        position: 'start',
        pieceTheme: 'chessboardjs/website/img/chesspieces/uscf/{piece}.png',
    };
    let board = Chessboard('board', config);
    let evaluation = 0;
    function fetch_position() {
        const xhttp = new XMLHttpRequest();
        xhttp.onload = function() {
            if (board.fen() !== this.responseText.trim()) {
                board.position(this.responseText.trim());
            }
        };
        xhttp.open("GET", "stockfish-fen.txt?d="+Date.now());
        xhttp.send();
        setTimeout(fetch_position, 100);
    }
    function fetch_eval() {
        const xhttp = new XMLHttpRequest();
        xhttp.onload = function() {
            if (evaluation !== parseFloat(this.responseText.trim())) {
                evaluation = parseFloat(this.responseText.trim());
                document.getElementById("eval").innerHTML = this.responseText.trim()
            }
        };
        xhttp.open("GET", "stockfish-eval.txt?d="+Date.now());
        xhttp.send();
        setTimeout(fetch_eval, 100);
    }
    fetch_position();
    fetch_eval();
</script>
